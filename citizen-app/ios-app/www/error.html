<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>창원 안심길</title>
<!--
  앱에 내장되는 로딩 페이지. 서버(Render 무료 플랜)가 잠들어 있어 첫 접속이 실패하거나 느릴 때
  이 화면을 보여주면서 /api/health가 응답할 때까지 3초마다 다시 확인하고, 준비되면 웹앱으로 넘어간다.
  capacitor.config.json의 server.errorPath가 이 파일(error.html)을 가리킨다.
-->
<style>
  :root { --navy: #1e3a8a; --blue: #1d4ed8; --sky: #93c5fd; --lamp: #fde047; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--navy), var(--blue));
    color: #fff; font-family: -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); text-align: center;
  }
  .scene { position: relative; width: 280px; height: 120px; }
  .road { position: absolute; left: 0; right: 0; bottom: 18px; height: 4px;
    background: repeating-linear-gradient(90deg, var(--sky) 0 14px, transparent 14px 24px); border-radius: 2px; }
  .lamp { position: absolute; bottom: 22px; width: 4px; height: 62px; background: #fff; border-radius: 2px; }
  .lamp::before { content: ""; position: absolute; top: -8px; left: -9px; width: 22px; height: 10px; background: #fff; border-radius: 6px; }
  .lamp::after { content: ""; position: absolute; top: -4px; left: -6px; width: 16px; height: 12px; border-radius: 50%;
    background: var(--lamp); box-shadow: 0 0 0 rgba(253, 224, 71, 0); animation: glow 3s infinite; }
  .lamp:nth-of-type(2)::after { animation-delay: 1s; }
  .lamp:nth-of-type(3)::after { animation-delay: 2s; }
  .walker { position: absolute; bottom: 24px; left: 0; font-size: 30px; animation: walk 3s linear infinite; }
  @keyframes walk { from { transform: translateX(-10px); } to { transform: translateX(250px); } }
  @keyframes glow { 0%, 100% { opacity: .35; box-shadow: 0 0 0 rgba(253,224,71,0); }
                    30% { opacity: 1; box-shadow: 0 0 26px 10px rgba(253,224,71,.55); } }
  h1 { font-size: 19px; line-height: 1.5; margin: 0; font-weight: 700; }
  p { margin: 0; color: #bfdbfe; font-size: 14px; line-height: 1.6; }
  button { font: inherit; font-weight: 700; color: var(--navy); background: #fff; border: 0; border-radius: 12px; padding: 12px 22px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .walker, .lamp::after { animation: none; } }
</style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <span class="lamp" style="left: 40px"></span>
    <span class="lamp" style="left: 138px"></span>
    <span class="lamp" style="left: 236px"></span>
    <span class="road"></span>
    <span class="walker">🚶</span>
  </div>
  <h1>창원시의 안전한 보행경로를 위해<br>지도를 불러오고 있습니다</h1>
  <p id="msg">서버를 준비하는 중이라 1~2분 정도 걸릴 수 있어요.</p>
  <button id="retry" type="button" hidden>다시 시도</button>

<script>
  const SERVER = "https://changwon-ansimgil.onrender.com";
  const msg = document.getElementById("msg");
  const retry = document.getElementById("retry");
  let started = Date.now();
  let timer = null;

  try { window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen && window.Capacitor.Plugins.SplashScreen.hide(); } catch (e) {}

  async function check() {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 15000);
      const res = await fetch(SERVER + "/api/health", { cache: "no-store", signal: ctrl.signal });
      clearTimeout(t);
      if (res.ok) { window.location.replace(SERVER + "/index.html"); return; }
    } catch (e) { /* 아직 깨어나는 중이거나 오프라인 */ }
    if (!navigator.onLine) {
      msg.textContent = "인터넷에 연결되어 있지 않아요. 연결을 확인한 뒤 다시 시도해 주세요.";
      retry.hidden = false;
      return;
    }
    if (Date.now() - started > 180000) {
      msg.textContent = "서버 응답이 늦어지고 있어요. 잠시 후 다시 시도해 주세요.";
      retry.hidden = false;
      return;
    }
    timer = setTimeout(check, 3000);
  }

  retry.addEventListener("click", () => {
    retry.hidden = true;
    msg.textContent = "서버를 준비하는 중이라 1~2분 정도 걸릴 수 있어요.";
    started = Date.now();
    clearTimeout(timer);
    check();
  });
  window.addEventListener("online", () => { if (!retry.hidden) retry.click(); });
  check();
</script>
</body>
</html>
