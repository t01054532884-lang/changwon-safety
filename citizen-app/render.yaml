# Render Blueprint — 창원 안심길 시민 앱 (프론트엔드 + 백엔드 통합 배포)
#
# 사용법(사용자 측 1회 작업):
#   1) https://render.com 가입(무료) → New → Blueprint
#   2) 이 저장소(changwon-safety) 연결, 이 파일(citizen-app/render.yaml)을 자동 인식
#   3) Apply 클릭 → 몇 분 뒤 https://<서비스이름>.onrender.com 같은 공개 주소 발급
#      (그 주소 하나로 앱 화면과 /api/safety, /api/route가 전부 같이 열림 —
#       Tmap 등 외부 API 앱 등록 시 이 주소를 "서비스 URL"로 쓰면 됨)
#
# 무료 티어 참고: 일정 시간 요청이 없으면 슬립 상태가 되고, 다음 요청 때 다시
# 깨어나는 데 수십 초 정도 걸릴 수 있음(콜드 스타트). 데모/공모전 심사 직전에는
# 한 번 미리 접속해서 깨워두는 걸 추천.

services:
  - type: web
    name: changwon-ansimgil
    runtime: python
    plan: free
    rootDir: citizen-app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TMAP_APP_KEY
        sync: false  # Render 대시보드 > Environment 탭에서 직접 입력(저장소에는 절대 커밋하지 않음)
      - key: NAVER_MAP_CLIENT_ID
        sync: false  # 2026-09-26 추가: 홈/안심경로 지도 표시(네이버 지도 JS SDK)용 Client ID.
        # 네이버클라우드 콘솔에서 발급받은 값을 Render 대시보드 > Environment 탭에서 입력.
        # admin 웹이 이미 쓰는 것과 같은 Client ID를 재사용해도 되지만, 그 경우 네이버클라우드
        # 콘솔의 해당 애플리케이션 "Web 서비스 URL" 허용 목록에 이 서비스 도메인
        # (예: changwon-ansimgil.onrender.com)도 함께 등록해야 지도가 뜬다.
